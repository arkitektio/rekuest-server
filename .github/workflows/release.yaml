name: Release

on:
  push:
    branches: [main, next, "*.x"] # main: stable, next: prereleases, N.x: maintenance
  # Releases are tag-only, so a branch whose commits are all released already has
  # no way to (re)publish its image -- and a non-releasable commit (ci:, chore:)
  # never cuts one at all. Running this by hand re-evaluates the branch and
  # rebuilds on its terms, instead of inventing a commit purely to force a build.
  workflow_dispatch:

# Needed so semantic-release can push the release tag and create the GitHub
# Release. Nothing is committed to the branch.
permissions:
  contents: write

jobs:
  # 0. The pair: takt's own suites and the conformance run of both programs built from this
  #    commit. The two are released as one version, so a red pair blocks the release.
  takt:
    uses: ./.github/workflows/takt.yaml

  # 0b. The hub: the pair built from this commit, put into the hub the installer
  #     (Konstruktor, its main branch) generates, started the way `konstruktor up` starts
  #     it, and asked what a hub is asked: every service healthy, rekuest's catalog filled,
  #     hook agents provisioned. A release that a hub written by the installer does not run
  #     on is caught here, before a tag exists, instead of by every hub that updates.
  #
  #     Not for a breaking release: a new major is exactly the release an installer has
  #     to be taught first, and hubs only follow a major the installer names.
  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is this a breaking release?
        id: kind
        run: |
          last="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          range="${last:+$last..}HEAD"
          if git log --format='%s%n%b' "$range" | grep -Eq '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE:'; then
            echo "breaking=true" >> "$GITHUB_OUTPUT"
            echo "A breaking release since ${last:-the beginning}: the installer learns it first; not tried in a hub."
          else
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.kind.outputs.breaking != 'true'
        uses: docker/setup-buildx-action@v3

      # The label the released image carries: the installer reads what rekuest is from it, and
      # refuses an image without one.
      - name: Describe the service as an image label
        if: steps.kind.outputs.breaking != 'true'
        id: describe
        uses: arkitektio/arkitekt-service/.github/actions/describe-label@v7.1.2
        with:
          service: rekuest.contract

      - name: Build the server as a hub would pull it
        if: steps.kind.outputs.breaking != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: rekuest-candidate:ci
          labels: |
            org.opencontainers.image.version=0.0.0-candidate
            ${{ steps.describe.outputs.label }}
          # Where the image's code came from: `arkitekt-service describe` says it (`source`),
          # so that an installer can run the service from a checkout of this commit.
          build-args: |
            ARKITEKT_SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
            ARKITEKT_SOURCE_REVISION=${{ github.sha }}

      - name: Build takt
        if: steps.kind.outputs.breaking != 'true'
        uses: docker/build-push-action@v5
        with:
          context: takt
          load: true
          tags: rekuest-takt-candidate:ci
          labels: org.opencontainers.image.version=0.0.0-candidate
          cache-from: type=gha,scope=takt

      - name: Check out the installer
        if: steps.kind.outputs.breaking != 'true'
        uses: actions/checkout@v4
        with:
          repository: arkitektio/konstruktor
          path: konstruktor

      - name: install Rust stable
        if: steps.kind.outputs.breaking != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        if: steps.kind.outputs.breaking != 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "konstruktor -> target"

      - name: install dependencies
        if: steps.kind.outputs.breaking != 'true'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Login to Docker Hub (avoids anonymous pull limits for the rest of the hub)
        if: steps.kind.outputs.breaking != 'true'
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start a hub on this commit's pair and ask every service
        if: steps.kind.outputs.breaking != 'true'
        working-directory: konstruktor
        env:
          KONSTRUKTOR_E2E: "1"
          KONSTRUKTOR_E2E_IMAGES: rekuest=rekuest-candidate:ci,rekuest-takt=rekuest-takt-candidate:ci
        run: cargo test -p konstruktor-core --test hub_health -- --ignored --nocapture

      - name: containers at failure
        if: failure()
        run: docker ps -a

  # 1. The server's suite, beside the pair and the hub: it needs nothing they build.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.12"

      - name: Install the project
        run: uv sync --all-extras --dev

      # The integration suite brings a docker-compose stack up per test through
      # dokker, so one run pulls its base images (postgres, redis, ...) dozens of
      # times. Anonymous Docker Hub pulls are rate limited per source IP, and a
      # test step that trips the limit fails the release -- which then cuts no
      # version and publishes no image, a release that silently does nothing.
      # Authenticate with the credentials the image jobs already use. Best
      # effort: raising the pull limit is an optimisation, so a repo with no
      # DOCKERHUB_* secrets configured must not have its release blocked by it.
      # Anonymous pulls still work, they are just rate limited.
      - name: Login to Docker Hub (avoids anonymous pull limits in the test stacks)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run tests
        run: uv run pytest

  # 2. The images of the version this commit would release, built beside the gates and
  #    pushed under a candidate tag only (`candidate-<sha>`): nothing pulls those. Once the
  #    gates pass and the version is tagged, `docker` gives them their release tags, which
  #    is a registry copy of seconds instead of a build. Two images, one version: the
  #    server (GraphQL, migrations) and takt (the agent protocol, takt/), which writes the
  #    schema this server migrates and is only ever run beside the server of the same
  #    release. A commit that releases nothing builds nothing here.
  images:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs the full history + tags

      # The version `release` will tag, decided without tagging anything.
      - name: The version this commit releases
        id: version
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          no_operation_mode: true
          commit: false
          tag: false
          push: false
          changelog: false
          vcs_release: false

      - name: Set up QEMU
        if: steps.version.outputs.released == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.version.outputs.released == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.version.outputs.released == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The labels of the release (its version among them); the tag is the candidate's.
      - name: Docker meta (the release's labels)
        if: steps.version.outputs.released == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jhnnsrs/rekuest
          tags: type=raw,value=candidate-${{ github.sha }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # What the service is, stamped into the image as a label: an installer reads it from the
      # registry instead of pulling the image to run it.
      - name: Describe the service as an image label
        if: steps.version.outputs.released == 'true'
        id: describe
        uses: arkitektio/arkitekt-service/.github/actions/describe-label@v7.1.2
        with:
          service: rekuest.contract

      - name: Build and push the server candidate
        if: steps.version.outputs.released == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            ${{ steps.describe.outputs.label }}
          # Where the image's code came from: `arkitekt-service describe` says it (`source`),
          # so that an installer can run the service from a checkout of this commit.
          build-args: |
            ARKITEKT_SOURCE_REPOSITORY=${{ github.server_url }}/${{ github.repository }}
            ARKITEKT_SOURCE_REVISION=${{ github.sha }}

      - name: Docker meta for takt (the release's labels)
        if: steps.version.outputs.released == 'true'
        id: takt-meta
        uses: docker/metadata-action@v5
        with:
          images: jhnnsrs/rekuest-takt
          tags: type=raw,value=candidate-${{ github.sha }}
          labels: org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # takt's Dockerfile cross-compiles: the Rust build runs on the runner's own
      # architecture for both platforms, with its dependencies in a layer of their own
      # (cargo-chef) that this cache keeps per platform. Emulation is only used for the
      # final stage.
      - name: Build and push the takt candidate
        if: steps.version.outputs.released == 'true'
        uses: docker/build-push-action@v5
        with:
          context: takt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.takt-meta.outputs.tags }}
          labels: ${{ steps.takt-meta.outputs.labels }}
          cache-from: type=gha,scope=takt
          cache-to: type=gha,scope=takt,mode=max

  # 3. Once every gate passed: let python-semantic-release decide the next version
  #    from the conventional-commit history, tag HEAD (vX.Y.Z on main /
  #    vX.Y.Z-rc.N on next) and cut a GitHub Release with generated notes.
  release:
    needs: [takt, hub, tests, images]
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs the full history + tags

      # The candidates carry the version `images` decided as their label: a release tagged
      # under another version (a tag pushed in between) would publish them mislabelled.
      - name: The version the candidates were built for
        id: decided
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          no_operation_mode: true
          commit: false
          tag: false
          push: false
          changelog: false
          vcs_release: false

      - name: Refuse a version the candidates were not built for
        if: steps.decided.outputs.released != needs.images.outputs.released || steps.decided.outputs.version != needs.images.outputs.version
        run: |
          echo "The images were built for '${{ needs.images.outputs.version }}' (released: ${{ needs.images.outputs.released }}), but this commit now releases '${{ steps.decided.outputs.version }}' (released: ${{ steps.decided.outputs.released }}). Run the workflow again." >&2
          exit 1

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Tag-only release: no bump commit is created or pushed, so main and
          # next never diverge on the version line and local clones never fall
          # behind the branch. CHANGELOG.md is not written either -- the release
          # notes live on the GitHub Release. The version exists only as the git
          # tag, which is what the docker job below consumes; nothing reads
          # project.version in pyproject.toml at build or run time.
          commit: false
          changelog: false

      # Append the Docker image pull instructions and a contributors list to the
      # freshly-created Release. This only needs the version + git history, so it
      # does not wait on the image tags — the docker job (and its registry tags)
      # come from the same version.
      - name: Enrich the GitHub Release notes
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Moving channel tag that tracks this release line.
          case "$BRANCH" in
            main) channel="latest" ;;
            next) channel="next" ;;
            *)    channel="${VERSION%%.*}" ;; # N.x maintenance -> major tag
          esac
          # Contributors since the previous release tag (empty range on first release).
          prev="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          range="${prev:+$prev..}${TAG}"
          contributors="$(git log --format='- %an' "$range" | sort -u)"
          body="$(gh release view "$TAG" --json body --jq .body)"
          {
            printf '%s\n\n' "$body"
            printf '## Docker images\n\n'
            printf 'The server and takt (the agent protocol) are released as a pair: run the same version of both.\n\n'
            printf '```sh\ndocker pull jhnnsrs/rekuest:%s\ndocker pull jhnnsrs/rekuest-takt:%s\n```\n\n' "$VERSION" "$VERSION"
            printf 'Also published as `:%s`.\n\n' "$channel"
            printf '## Contributors\n\n%s\n' "$contributors"
          } | gh release edit "$TAG" --notes-file -

  # 4. Only if a release was actually cut: give the candidates their release tags under
  #    the semver "multi-tag" regime. metadata-action expands the tag into the full set,
  #    and automatically skips the moving major/minor/latest tags for prereleases:
  #      v1.2.3       -> 1.2.3, 1.2, 1, latest
  #      v1.2.3-rc.1  -> 1.2.3-rc.1
  docker:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (semver multi-tag)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: jhnnsrs/rekuest
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }}
            # Moving staging tag: deployments/next pins jhnnsrs/rekuest:next.
            type=raw,value=next,enable=${{ github.ref_name == 'next' }}
          # Only main (the newest major) owns `latest`. Maintenance releases off
          # an N.x branch still get their moving N / N.M tags but must NOT claim
          # `latest`, or shipping 1.5.3 would point latest back at the old major.
          flavor: |
            latest=${{ github.ref_name == 'main' }}

      - name: Docker meta for takt (the same tags)
        id: takt-meta
        uses: docker/metadata-action@v5
        with:
          images: jhnnsrs/rekuest-takt
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }}
            type=raw,value=next,enable=${{ github.ref_name == 'next' }}
          flavor: |
            latest=${{ github.ref_name == 'main' }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Both platforms' manifests, as built and labelled, under every release tag.
      - name: Tag the candidates as the release
        env:
          SERVER_TAGS: ${{ steps.meta.outputs.tags }}
          TAKT_TAGS: ${{ steps.takt-meta.outputs.tags }}
          CANDIDATE: candidate-${{ github.sha }}
        run: |
          retag() {
            source="$1"; shift
            args=()
            while IFS= read -r tag; do
              [ -n "$tag" ] && args+=(--tag "$tag")
            done <<< "$1"
            docker buildx imagetools create "${args[@]}" "$source"
          }
          retag "jhnnsrs/rekuest:$CANDIDATE" "$SERVER_TAGS"
          retag "jhnnsrs/rekuest-takt:$CANDIDATE" "$TAKT_TAGS"
