name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # A Postgres with the rekuest server's schema, migrated by the server itself.
      - run: scripts/test-db.sh >> "$GITHUB_ENV"
      - run: sed -i 's/^export //' "$GITHUB_ENV"
      - run: cargo test

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - working-directory: conformance
        run: uv sync && uv run pytest -m "not slow"
