authentikate:
  # This service's identifier, matched against the token's `aud` claim. Required
  # since the backend bump. The static_tokens below never have their audience
  # checked (they are pasted into this config by hand), so this only has to be
  # honest, not permissive.
  audience: rekuest
  issuers:
    - kind: rsa
      iss: lok
      kid: lok-key-1
      public_key: ssh-rsa 
  static_tokens:
    # One per conformance scenario: a token is one agent, and scenarios must not share a lease.
    conf_1:
      sub: 101
      iss: lok
      active_org: conformance
      client_device: conf_1_device
      client_app: conf_1
      client_release: v0.0.1
      client_id: conf_1
