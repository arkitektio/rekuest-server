django:
  admin:
    email: admin@admin.com
    password: admin
    username: admin
  debug: false
  hosts:
  - "*"
  secret_key: t!7qh%)_#&k_6px&n(xm4bes@t3nrmgh=h2k#8f@rbgz=&y9f21
lok:
  issuer: lok
  key_type: RS256
  public_key: ssh-rsa 
provenance:
  # Rekuest acts as the provenance authority: it signs an attestation JWT per
  # non-trivial assignment. This keypair is orthogonal to the auth keys above
  # (different issuer, different lifetime). The private key never leaves Rekuest
  # and is never sent to agents. Dev keypair below — replace in production.
  issuer: rekuest
  kid: rekuest-prov-1
  token_ttl_seconds: 3600
  # role(s) on the auth token / membership that mark an accountable human.
  # Empty list = do not enforce the human-root invariant (lenient default).
  human_roles: []
  # require the human-root invariant; when true a non-human root refuses minting.
  strict: false
  private_key: |
    -----BEGIN PRIVATE KEY-----
    MC4CAQAwBQYDK2VwBCIEICiiKTIO7nNNDVtWjD79jxM7alsjZZEhVNICrYhdwr/x
    -----END PRIVATE KEY-----
  public_key: |
    -----BEGIN PUBLIC KEY-----
    MCowBQYDK2VwAyEADZ32a0NRsa619PGNaXJojnisFVMUfNF/i972xnNpj7M=
    -----END PUBLIC KEY-----
redis:
  host: redis
  port: 6379
authentikate:
  # authentikate 4.0 requires AUDIENCE. "*" (ANY_AUDIENCE) accepts a token minted
  # for any service; the `aud` claim itself is still required. Replace with this
  # service's identifier to check which service the token was minted for.
  audience: "*"
  issuers:
  - kind: rsa
    iss: lok
    kid: lok-key-1
    public_key: ssh-rsa 
  static_tokens: {}
embeddings:
  # Semantic `search` over actions: name + description are embedded on save by a small
  # static model that runs inside the service (no GPU, no extra service) and stored in a
  # pgvector column. All keys have defaults; the block may be omitted. `dimensions` is also
  # the width of the database column -- changing the model's width is a migration, see
  # CONFIG.md. The Docker image bakes the weights and sets EMBEDDINGS__MODEL_PATH itself.
  enabled: true
  model: minishlab/potion-base-8M
  dimensions: 256
  distance_threshold: 0.55
postgres:
  db_name: rekuest_db
  engine: django.db.backends.postgresql
  host: db
  password: postgres
  port: 5432
  username: fostgres
