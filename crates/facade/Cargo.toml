[package]
name = "rekuest-server-facade"
description = "The agent-protocol app (mirrors the Python server's `facade/`, module for module)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The Python package this crate takes over, so code reads like it: `facade::…`.
name = "facade"

[dependencies]
rekuest-protocol.workspace = true
authentikate.workspace = true
rekuest-core.workspace = true
kante.workspace = true
ring.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
redis.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
futures = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["process", "io-util"] }
chrono.workspace = true
