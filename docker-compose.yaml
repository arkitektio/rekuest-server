# The pair, built from this checkout, for local use: the rekuest server (GraphQL, migrations)
# and takt (the agent protocol and every clock). Both read ./config.yaml.
#
#   docker compose up --build
#
#   GraphQL            http://localhost:8234/graphql   (the server)
#   agent protocol     ws://localhost:8235/agi         (takt)
#
# There is no gateway here, so the two programs are published on two ports. A deployment puts
# one in front and routes `<script name>/agi*` to takt and everything else to the server.
services:
  db:
    image: jhnnsrs/daten:latest
    environment:
      POSTGRES_MULTIPLE_DATABASES: rekuest_db
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: fostgres

  redis:
    image: redis:latest

  # The server: migrates the schema on boot, then serves GraphQL and its subscriptions.
  rekuest:
    build: .
    command: bash run.sh
    depends_on:
      - db
      - redis
    environment:
      # Where the server reaches takt's internal API: the socket takt binds in the volume both
      # mount. The URL only gives the path, and config.yaml sets no django.force_script_name,
      # so there is no path prefix.
      REKUEST__TAKT_URL: http://takt
      REKUEST__TAKT_SOCKET: /run/takt/internal.sock
    ports:
      - "8234:80"
    volumes:
      - ./config.yaml:/workspace/config.yaml:ro
      - takt_run:/run/takt

  # takt: the agent websocket, the HookAgent and signal intakes, the internal API and every
  # sweep. It never migrates: it waits until the server has applied the migrations listed in
  # takt/schema-migrations.txt. Its image carries its own HEALTHCHECK (`takt healthcheck`).
  takt:
    build: ./takt
    depends_on:
      - db
      - redis
      - rekuest
    environment:
      # The internal API is not on the published port: only the server reaches this socket.
      TAKT_INTERNAL_BIND: unix:/run/takt/internal.sock
    ports:
      - "8235:8080"
    volumes:
      - ./config.yaml:/workspace/config.yaml:ro
      - takt_run:/run/takt

volumes:
  takt_run:
