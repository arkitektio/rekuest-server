[project]
name = "rekuest-server"
# Placeholder only — the git tag is authoritative. Releases are tag-only,
# so semantic-release does not update this field. See [tool.semantic_release].
version = "3.0.2-rc.1"
description = "High-performance Rekuest server"
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.12,<4"
readme = "README.md"
dependencies = [
    "django>=6.0.3", #
    "pydantic-settings[yaml]>=2.2",
    "psycopg[binary]>=3.3.3",
    "daphne>=4.2.1,<5",
    "channels-redis>=4.3.0,<5",
    "django-choices-field>=2.3.0,<3",
    "authentikate>=4.1.1",
    "ujson>=5.12.0,<6",
    "aioredis>=2.0.1,<3",
    "jsonpatch~=1.33",
    "django-probes>=1.8.0,<2",
    "rich>=14.3.3",
    "django-health-check>=4.2.1",
    "kante>=2.1.1",
    "django-polymorphic>=4.11.2",
    "boto3>=1.42.73",
    "jsonschema>=4.26.0",
    "dokker>=2.8",
    "whitenoise>=6.6",
    "pint>=0.24",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.8",
    "django-stubs>=6.0.1",
    "dokker>=2.8",
    "moto>=5.1.22",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "python-semantic-release>=9.21.0",
]


[tool.django-stubs]
django_settings_module = "rekuest.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "rekuest.settings_test"

[tool.ruff]
line-length = 300
target-version = "py312"

[tool.ruff.lint]
# Updated Ruff config format (new versions of Ruff prefer tool.ruff.lint)
extend-select = ["ANN", "D1", "I"] # Added 'I' for import sorting (speedup)
extend-ignore = ["ANN002", "ANN003", "D100", "ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["rekuest"]

# Type gate for the refactored real-time / protocol plumbing. Run: `basedpyright`.
# Scoped to the typed plumbing modules; the ORM/pydantic dynamic-inference rules are relaxed
# (pyright can't see Django's descriptor/manager magic or pydantic defaults without a mypy
# plugin), so the gate enforces the things that matter here — untyped params, wrong types,
# bad calls, unreachable code — without drowning in Django false positives.
[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = [
    "facade/ports.py",
    "facade/transport.py",
    "facade/message_router.py",
    "facade/grace.py",
    "facade/caller_context.py",
    "facade/caller_events.py",
    "facade/hooks.py",
    "facade/consumers/agent_protocol.py",
    "facade/probes/backend.py",
    "facade/probes/store.py",
    "facade/probes/persist.py",
    "facade/probes/ids.py",
]
exclude = ["**/migrations", "**/__pycache__", ".venv", "tests"]
# Django models / pydantic models defeat structural inference without a plugin.
reportAttributeAccessIssue = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportAny = false
reportUnusedCallResult = false
reportMissingTypeStubs = false

[tool.semantic_release]
# This server is deployed as Docker images, not a PyPI package — so a release
# just tags the commit and cuts a GitHub Release. No wheel is built and nothing
# is uploaded to PyPI.
#
# Releases are tag-only: the workflow passes `commit: false` / `changelog: false`,
# so semantic-release never writes back to the branch. That is what keeps `main`
# and `next` from diverging on the version line. Consequences, deliberate:
#   - no `version_toml`: the git tag is the sole version source, and the
#     `version` field under [project] above is an inert placeholder.
#   - no `commit_message`: dead config when nothing is committed.
#   - the docker job reads `steps.release.outputs.tag`, so images are unaffected.
build_command = ""

# main -> stable X.Y.Z releases. next -> prereleases X.Y.Z-rc.N.
[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.next]
match = "next"
prerelease = true
prerelease_token = "rc"

# Maintenance branches (1.x, 2.x, ...) cut stable patch/minor releases for an
# older major after a new major has shipped from main — e.g. 1.5.3 off `1.x`
# while main is on 2.x. The regex is reused for every future major's line.
[tool.semantic_release.branches.maintenance]
match = '^\d+\.x$'
prerelease = false

# Keep the changelog / release notes focused on user-facing changes. These
# patterns only filter what's rendered — they do not affect version bumps.
[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '^chore(?:\([^)]*\))?: ', # includes the chore(release): … bump commit
    '^ci(?:\([^)]*\))?: ',
    '^build(?:\([^)]*\))?: ',
    '^style(?:\([^)]*\))?: ',
    '^test(?:\([^)]*\))?: ',
    '^Merge ',
]
