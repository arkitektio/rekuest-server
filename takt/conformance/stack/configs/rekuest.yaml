lok:
  issuer: lok
  key_type: RS256
  public_key: ssh-rsa 
redis:
  host: redis
  port: 6379
datalayer:
  access_key: mikro_access_key
  secret_key: mikro_secret_key
  host: rustfs
  port: 9000
  protocol: http
  media:
    bucket: media
postgres:
  db_name: rekuest
  engine: django.db.backends.postgresql
  host: db
  password: hello_django
  port: 5432
  username: hello_django
provenance:
  issuer: rekuest
  kid: rekuest-prov-1
  token_ttl_seconds: 3600
  human_roles: []
  strict: false
  private_key: |
    -----BEGIN PRIVATE KEY-----
    MC4CAQAwBQYDK2VwBCIEILK+rl9gVEjfKGiye+mLLjfEUGIdoP0WPC8lMZS3NYK2
    -----END PRIVATE KEY-----
  public_key: |
    -----BEGIN PUBLIC KEY-----
    MCowBQYDK2VwAyEA6lDpKZJ0ManLzreBg43+fZPoPP5lHOVk2E23pFDzNck=
    -----END PUBLIC KEY-----
# Since rekuest server 4: this instance's key (signs provenance tokens and service
# requests) and the hub trust bundle. The test key is the provenance pair above.
instance:
  private_key: |
    -----BEGIN PRIVATE KEY-----
    MC4CAQAwBQYDK2VwBCIEILK+rl9gVEjfKGiye+mLLjfEUGIdoP0WPC8lMZS3NYK2
    -----END PRIVATE KEY-----
rekuest:
  # The agent protocol's home: the server delegates assigns, controls and registrations to it.
  # Through the socket both containers mount (takt: TAKT_INTERNAL_BIND); the URL gives the path.
  takt_url: http://takt
  takt_socket: /run/takt/internal.sock
scopes:
  rekuest_agent: Act as an agent
  rekuest_call: Call other apps with rekuest
