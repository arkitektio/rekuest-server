[package]
name = "rekuest-server-facade"
description = "The agent-protocol app (mirrors the Python server's `facade/`, module for module)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The Python package this crate takes over, so code reads like it: `facade::…`.
name = "facade"

[dependencies]
rekuest-protocol.workspace = true
authentikate.workspace = true
rekuest-core.workspace = true
kante.workspace = true
ring.workspace = true
hmac.workspace = true
reqwest.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
croner.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
redis.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
futures = "0.3"
# The embedding model, as the Python server loads it. `local-only`: the weights are in the
# image, nothing is fetched. The tokenizer's regex engine is named here rather than through
# model2vec-rs's `fancy-regex` feature, which also turns on `esaxx_fast` — C++, and with it a
# C++ cross toolchain for a tokenizer trainer nothing here uses. This way the build stays
# pure Rust.
model2vec-rs = { version = "0.3", default-features = false, features = ["local-only"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tokio = { workspace = true, features = ["process", "io-util"] }
chrono.workspace = true
