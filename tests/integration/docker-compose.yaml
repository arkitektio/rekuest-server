
services:
   db:
      # Needs a daten image that carries pgvector (`jhnnsrs/daten:next` does since
      # 2026-09-20). dokker pulls the stack before every run, so a local build tagged
      # `:next` is overwritten by the hub's; to test against a local build, tag it
      # differently and point DATEN_IMAGE at it.
      image: ${DATEN_IMAGE:-jhnnsrs/daten:next}
      environment:
         POSTGRES_MULTIPLE_DATABASES: testdb
         POSTGRES_PASSWORD: test
         POSTGRES_USER: test
      labels:
         - fakts.service=live.arkitekt.postgres
      ports:
        - "${REKUEST_TEST_DB_PORT:-5555}:5432"
   redis:
      environment:
         REDIS_HOST: redis
         REDIS_PORT: 6379
      image: redis
      ports:
         - "${REKUEST_TEST_REDIS_PORT:-6666}:6379"
   takt:
      # rekuest's other half, built from this checkout (TAKT_IMAGE names a prebuilt one instead).
      # It is started once the test database exists and is migrated (tests/conftest.py) and
      # works in that database: the tests' rows are its rows.
      image: ${TAKT_IMAGE:-rekuest-test-takt}
      build: ../../takt
      environment:
         TAKT_CONFIG: /workspace/config.yaml
         # The internal API, published for the test process (nothing else can reach it).
         TAKT_INTERNAL_BIND: 0.0.0.0:8081
         POSTGRES__HOST: db
         POSTGRES__DB_NAME: test_testdb
         POSTGRES__USERNAME: test
         POSTGRES__PASSWORD: test
         REDIS__HOST: redis
         # No server to ask for upkeep jobs: the tests run in-process.
         REKUEST__SERVER_URL: ""
         # One sweep at start, then none: a test's rows are only touched by what the test asks
         # for. A schedule is planned when its notice arrives, as in production.
         REKUEST__SWEEP_INTERVAL: "86400"
      ports:
         - "${REKUEST_TEST_TAKT_PORT:-7777}:8081"
      volumes:
         - ../../config.yaml:/workspace/config.yaml:ro
