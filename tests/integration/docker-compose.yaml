
services:
   db:
      # Needs a daten image that carries pgvector (`jhnnsrs/daten:next` does since
      # 2026-09-20). dokker pulls the stack before every run, so a local build tagged
      # `:next` is overwritten by the hub's; to test against a local build, tag it
      # differently and point DATEN_IMAGE at it.
      image: ${DATEN_IMAGE:-jhnnsrs/daten:next}
      environment:
         POSTGRES_MULTIPLE_DATABASES: testdb
         POSTGRES_PASSWORD: test
         POSTGRES_USER: test
      labels:
         - fakts.service=live.arkitekt.postgres
      ports:
        - "${REKUEST_TEST_DB_PORT:-5555}:5432"
   redis:
      environment:
         REDIS_HOST: redis
         REDIS_PORT: 6379
      image: redis
      ports:
         - "${REKUEST_TEST_REDIS_PORT:-6666}:6379"
